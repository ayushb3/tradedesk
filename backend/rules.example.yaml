# PLACEHOLDER rules. The real file is data/rules.yaml (gitignored), copied from
# this one on first run and thereafter rewritten through the rules conversation.
timezone: America/Los_Angeles
window:
  start: "06:30"   # PT wall-clock
  end: "08:30"     # PT wall-clock; fills after this are late
daily_stop: -100
daily_target: 200
loss_line:
  amount: 1000
  start_date: 2026-01-01
default_risk_pct: 30   # percent of premium when no max loss is written
account_size:
  source_path: rh-export/out/account.json
  fallback: 5000
rules:
  - {number: 1, text: "Rule 1: example rule text"}
  - {number: 2, text: "Rule 2: example rule text"}
  - {number: 3, text: "Rule 3: example rule text"}
  - {number: 4, text: "Rule 4: example rule text"}
  - {number: 5, text: "Rule 5: example rule text"}
  - {number: 6, text: "Rule 6: example rule text"}
  - {number: 7, text: "Rule 7: example rule text"}
  - {number: 8, text: "Rule 8: example rule text"}
  - {number: 9, text: "Rule 9: example rule text"}
# Pattern -> lessons that address it. Keys are ledger tag codes (added_lower,
# held_loser, gave_back, runner_paid, stop_risk, late_fill, overnight, off_plan,
# blown_max_loss, ...). The ids below are made up; put real lesson ids in data/rules.yaml.
lessons:
  added_lower:
    - {lesson_id: "ex-1", reason: "Example reason: why this lesson fits the pattern"}
  gave_back:
    - {lesson_id: "ex-2", reason: "Example reason: another one-line note"}
