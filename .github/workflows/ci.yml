# Scoped intentionally narrow for this first pass: backend tests (mock mode) +
# frontend typecheck/build. No ESLint/ruff/Vitest bundled in yet — tracked as
# separate follow-up work, not silently skipped.

name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  backend-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run tests (mock mode, no LLM, no credentials)
        env:
          TRADEDESK_MODE: mock
          TRADEDESK_LLM: none
        run: python -m pytest -q

  frontend-build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci

      - name: Typecheck + build
        run: npm run build
